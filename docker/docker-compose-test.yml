services:
  ####################### POSTGRES #######################
  postgres-test:
    image: postgres:17.10
    container_name: graph-taskmanager-test-postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "taskmanager_test"
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

####################### VOLUME AND NETWORKS #######################
volumes:
  postgres:
    name: graph-taskmanager-test-postgres-data